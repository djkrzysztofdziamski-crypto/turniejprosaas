    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://turniejomat.pl/setka-start.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:url" content="https://turniejomat.pl/setka-start.html">
    <meta property="og:title" content="SETKA — show na imprezie">
    <meta property="og:description" content="Dwie drużyny, tablica, finał. Demo 24h. Licencja od 89 zł.">
    <meta property="og:image" content="https://setka.turniejomat.pl/og-setka.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SETKA — show na imprezie">
    <meta name="twitter:description" content="Dwie drużyny, tablica, finał. Demo 24h. Licencja od 89 zł.">
    <meta name="twitter:image" content="https://setka.turniejomat.pl/og-setka.png">
    <link rel="icon" type="image/png" href="assets/setka-logo.png">
    <style>
        :root {
            --bg: #070d18;
            --gold: #ffcc00;
            --text: #f2f6ff;
            --muted: #b7c6e1;
            --ok: #57d9a3;
            --line: rgba(255,255,255,.14);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 480px at 50% -15%, #1a335f 0%, transparent 55%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
        }
        .shell {
            width: min(440px, 100%);
            text-align: center;
        }
        .brand-logo {
            display: block;
            width: min(148px, 42vw);
            height: auto;
            margin: 0 auto 16px;
            border-radius: 22px;
            box-shadow: 0 0 0 1px rgba(255, 204, 0, .28), 0 12px 36px rgba(0, 0, 0, .45);
        }
        .lead {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.45;
        }
        .actions {
            display: grid;
            gap: 12px;
        }
        a.btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--gold);
            color: #0b1220;
        }
        .btn-primary:hover { filter: brightness(1.05); }
        .btn-ghost {
            border: 1px solid var(--line);
            color: var(--text);
            background: rgba(255,255,255,.03);
        }
        .btn-ghost:hover {
            border-color: var(--ok);
            color: #fff;
        }
        .note {
            margin: 22px 0 0;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
        }
        .brand-footer {
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid rgba(183, 198, 225, .18);
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: .3px;
            color: rgba(183, 198, 225, .75);
        }
        .brand-footer-author {
            font-weight: 800;
            letter-spacing: .6px;
            color: var(--gold);
        }
    </style>
</head>
<body>
<div class="shell">
    <img class="brand-logo" src="assets/setka-logo.png" width="148" height="148" alt="SETKA">
    <p class="lead">Show jak z telewizji. Na Twojej imprezie.<br>Demo 24h · potem szybki podgląd 2h.</p>
    <div class="actions">
        <a class="btn btn-primary" href="https://setka.turniejomat.pl/">Uruchom grę (demo)</a>
        <a class="btn btn-ghost" href="https://setka.turniejomat.pl/?preview=1">Zobacz jak wygląda</a>
        <a class="btn btn-ghost" href="/setka.html">Kup licencję online</a>
    </div>
    <p class="note">Weekend od 89&nbsp;zł · 72&nbsp;h od aktywacji. Kod dostajesz od razu po płatności.</p>
    <p class="brand-footer">SETKA © 2026 · powered by TurniejPro · <span class="brand-footer-author">Kris Dziamsky</span></p>
</div>
</body>
</html>
